schemaVersion: agentic-scale-501-runtime-secret-references/v1
status: declared-not-mounted
defaultPolicy:
  materializeWhenDisabled: false
  includeInImage: false
  includeLiteralValuesInManifest: false
  requireNamespaceScopedSecret: true
  requireExplicitEnablementApproval: true
references:
  - capability: live-workflow-execution
    enabled: false
    secretName: agentic-scale-501-runtime
    key: workflow-service-token
    intendedConsumer: future-live-api
  - capability: approved-resource-telemetry
    enabled: false
    secretName: agentic-scale-501-runtime
    key: telemetry-service-token
    intendedConsumer: future-live-api
  - capability: model-endpoint-access
    enabled: false
    secretName: agentic-scale-501-runtime
    key: model-service-token
    intendedConsumer: future-live-api
rules:
  - The static presentation Deployment must not mount these references.
  - A future live API must reference Secret keys with valueFrom.secretKeyRef and must not copy values into a ConfigMap.
  - Missing references fail live startup closed; they never cause a fallback to rehearsal labeled as live.
  - Secret presence alone does not authorize live execution, fault injection, promotion, or certification.

