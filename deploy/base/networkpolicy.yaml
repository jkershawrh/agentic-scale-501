apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-scale-501-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentic-scale-501
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
          protocol: TCP
  egress: []

