name: verify-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install separate Showroom dependencies
        working-directory: showroom
        run: npm ci --ignore-scripts
      - name: Install Helm for chart validation
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Install contract validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema pytest pyyaml
      - name: Run all repository, contract, Showroom, and Helm checks
        run: npm run check
      - name: Enforce publication and learning contracts
        run: python -m pytest -q tests/publication
      - name: Reject vulnerable application dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix showroom audit --audit-level=high

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: presentation, file: packaging/Containerfile, image: agentic-scale-501-presentation}
          - {component: qualifier, file: Containerfile, image: agentic-scale-501-qualifier}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux AMD64 candidate without publishing
        run: >-
          docker buildx build
          --platform linux/amd64
          --file "${{ matrix.file }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          --tag "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
          --load .
      - name: Full vulnerability inventory and zero HIGH/CRITICAL gate
        uses: anchore/scan-action@v6
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          severity-cutoff: high
          fail-build: true
          output-format: json
          output-file: vulnerability-${{ matrix.component }}.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
      - name: Publish and verify exact digest
        id: publish
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          docker pull "$digest_ref"
          test "$(docker inspect --format='{{.Architecture}}' "$digest_ref")" = amd64
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > image-${{ matrix.component }}.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Sign and attest with GitHub OIDC
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.component }}.spdx.json "$DIGEST_REF"
          printf '{"builder":{"id":"%s"},"buildType":"https://github.com/Attestations/GitHubActionsWorkflow@v1","invocation":{"configSource":{"uri":"git+%s/%s","digest":{"sha1":"%s"},"entryPoint":".github/workflows/release.yml"}},"metadata":{"buildInvocationId":"%s"},"materials":[]}\n' "${{ github.workflow_ref }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.sha }}" "${{ github.run_id }}" > provenance.json
          cosign attest --yes --type slsaprovenance --predicate provenance.json "$DIGEST_REF"
      - name: Verify signature and attestations
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: |
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > signature-verification.json
          cosign verify-attestation --type spdxjson --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > sbom-verification.json
          cosign verify-attestation --type slsaprovenance --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > provenance-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentic-scale-501-${{ matrix.component }}-${{ github.sha }}
          retention-days: 90
          path: |
            image-${{ matrix.component }}.txt
            vulnerability-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.spdx.json
            provenance.json
            *-verification.json
