name: verify-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install separate Showroom dependencies
        working-directory: showroom
        run: npm ci --ignore-scripts
      - name: Install Helm for chart validation
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.18.4
      - name: Install contract validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run all repository, contract, Showroom, and Helm checks
        run: npm run check

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: presentation
            containerfile: packaging/Containerfile
          - name: qualifier
            containerfile: Containerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentic-scale-501-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agentic-scale-501-${{ matrix.name }}:latest
      - name: Reject HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/agentic-scale-501-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '1'
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3
        with:
          image: ghcr.io/${{ github.repository_owner }}/agentic-scale-501-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
      - name: Attest the immutable image digest with GitHub OIDC
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentic-scale-501-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
