services:
  presentation:
    image: localhost/agentic-scale-501-presentation:candidate
    build:
      context: ..
      dockerfile: packaging/Containerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    environment:
      EVIDENCE_SOURCE: rehearsal
      LIVE_EXECUTION_ENABLED: "false"
      TELEMETRY_COLLECTION_ENABLED: "false"
      FAULT_INJECTION_ENABLED: "false"
      CERTIFICATION_ENABLED: "false"
      AUTOMATED_PROMOTION_ENABLED: "false"
    ports:
      - 127.0.0.1:8080:8080
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

