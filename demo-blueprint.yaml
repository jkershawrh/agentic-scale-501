intent:
  primary_user: Platform engineers, AI reliability engineers, and architects responsible for production agentic systems
  workload: The same evidence-backed research, analyst, and executor workflow introduced at levels 301 and 401
  recognized_problem: A trustworthy single journey does not establish the capacity, resilience, quality, or recovery envelope of a production agentic system.
  audience_decision: Decide whether the declared deployment envelope is supported, conditionally supported, or rejected for promotion.
  desired_outcome: Run versioned baseline, sustained, and pressure profiles; correlate workload, policy, inference, quality, and lifecycle evidence; and issue a human-owned certification decision.
