        - {from: agents, to: mcp, purpose: retrieve bounded evidence, protocol: MCP-JSON-RPC, evidence: evidence-identifiers}
        - {from: agents, to: inference, purpose: generate role-specific responses, protocol: OpenAI-compatible-HTTP, evidence: model-latency-and-token-usage}
        - {from: orchestrator, to: policy, purpose: validate evidence and authority, protocol: in-process-policy, evidence: policy-result}
        - {from: orchestrator, to: collector, purpose: export the correlated proof envelope, protocol: OpenTelemetry-and-JSON, evidence: complete-correlation-set}
        - {from: collector, to: scorer, purpose: compare quality, policy, latency, throughput, and recovery with the declared envelope, protocol: versioned-evaluation, evidence: scorecard}
        - {from: scorer, to: reviewer, purpose: present a supported, conditional, or rejected recommendation, protocol: proof-package, evidence: human-review-record}
operational_pattern:
  name: Declare, run, pressure, recover, and certify
  rationale: Level 501 proves a bounded delivery envelope rather than demonstrating more agents or a larger static topology.
  steps:
    - id: declare
      name: Declare the envelope
      action: Select the immutable workload, model, evaluation set, concurrency, success thresholds, and failure budget.
      evidence: profile-id, source revisions, image digests, and target identity
    - id: baseline
      name: Establish the baseline
      action: Run a low-concurrency profile and verify correlation, quality, policy, and model identity.
      evidence: p50/p95 journey latency, inference latency, tokens, quality score, and policy compliance
    - id: sustain
      name: Hold useful load
      action: Increase concurrent journeys while measuring throughput, queueing, saturation, and evidence completeness.
      evidence: completed journeys, throughput, errors, backpressure, CPU allocation, and utilization
    - id: pressure
      name: Cross a controlled pressure boundary
      action: Apply one approved dependency or capacity pressure condition without changing the evaluation set.
      evidence: denial, retry budget, queue behavior, and quality/policy comparison
    - id: recover
      name: Recover and compare
      action: Remove the pressure condition and prove bounded recovery without evidence loss or unauthorized action.
      evidence: recovery time, post-recovery quality, correlation completeness, and zero automated promotion
    - id: certify
      name: Package the decision
      action: Produce an immutable proof package for human review and independent Launchpad certification.
      evidence: signed scorecard, blockers, reviewer disposition, and cleanup receipt
  changed_condition: A controlled pressure or dependency failure is introduced and then removed while the same versioned workload and evaluation set remain fixed.
  close: State the supported operating envelope, remaining blockers, and the human-owned promotion decision.
