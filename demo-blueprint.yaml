      status: verified
  external_dependencies:
    - Launchpad lifecycle and certification services
    - Approved Intel Xeon model endpoint
    - OpenTelemetry collector and approved infrastructure telemetry
  flows:
    - id: scale-certification-flow
      name: Profile to certification evidence
      status: proposed
      steps:
        - {from: learner, to: scale-runner, purpose: select a versioned profile and evaluation set, protocol: lab-control, evidence: profile-id}
        - {from: scale-runner, to: orchestrator, purpose: submit correlated workflows at bounded concurrency, protocol: HTTP, evidence: run-id-and-journey-id}
