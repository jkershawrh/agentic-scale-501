decisions:
  - id: profile-admission
    owner: Scale runner and Launchpad capacity policy
    rule: Run only immutable profiles admitted for the selected target and declared resource envelope.
    fail_closed: true
  - id: proof-completeness
    owner: Deterministic scorer
    rule: Return inconclusive when required correlation, policy, inference, quality, resource, or lifecycle evidence is absent.
    fail_closed: true
    implementation_status: proposed
  - id: promotion
    owner: Human certification reviewer through Launchpad
    rule: Measurements and LLM output may recommend but may never certify or promote automatically.
    fail_closed: true
    implementation_status: launchpad-owned
  - id: current-mutation-gap
    owner: Source application
    rule: The current keyword-driven create_task path must be replaced by pending approval, single-use authorization, and idempotent mutation before 501 execution.
    fail_closed: false
    implementation_status: blocking-gap
ai_assessment:
  needed: true
  kind: agentic-generative
  rationale: The workload being scaled is an agentic AI system, but scale admission, scoring, and promotion remain deterministic and human-owned.
  tasks:
    - Generate bounded research, analysis, and executor responses inside each evaluated journey.
  inputs:
    - Learner query
    - Accumulated prior-agent context
    - Approved MCP evidence
    - Role instructions and bounded model configuration
  outputs:
    - Role-specific text and structured workflow evidence
  model_identity_source: Workflow inference proof and deployment runtime secret
  hardware_identity_source: Approved target telemetry; unavailable until connected
  evidence_access:
    - Only evidence passed through the orchestrator and approved MCP tools
  action_authority: The model has no direct authority, but current application keyword logic can invoke create_task without human approval; recommend-only system authority is not yet enforced.
  validation:
    - Deterministic evidence and policy checks
    - Versioned quality scorer
    - Human review
  fallback: Missing or failed inference makes the run incomplete; fixtures remain REHEARSAL and cannot support certification.
  final_decision_owner: Human certification reviewer operating through Launchpad; the missing runtime approval boundary blocks 501 execution.
story_mapping:
  audience_question: How do we know one trustworthy agent journey remains trustworthy, useful, and recoverable at production scale?
  stakes:
    - Scaling requests can increase latency, queueing, cost, and incomplete evidence.
    - A system that stays available while losing policy or quality is not successfully scaled.
  architecture_flow_ids: [scale-certification-flow]
  live_proof_flow_ids: [scale-certification-flow]
  comparison: Baseline versus sustained load versus controlled pressure versus recovered state
  payoff: A measured operating envelope and human-owned certification recommendation, not a generic scale claim
  next_journey: Launchpad independent one-, five-, and twenty-five-seat certification after Agentic 401 is certified
