apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-presentation
  labels:
    {{- include "agentic-scale-501.labels" . | nindent 4 }}
    app.kubernetes.io/component: presentation
spec:
  replicas: {{ .Values.presentation.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}-presentation }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-presentation
        app.kubernetes.io/part-of: agentic-scale-501
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: presentation
          image: "{{ .Values.images.presentation.repository }}@{{ .Values.images.presentation.digest }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.presentation.resources | nindent 12 }}
          securityContext: {{- include "agentic-scale-501.securityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /run }
            - { name: nginx-tmp, mountPath: /var/lib/nginx/tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: run, emptyDir: { sizeLimit: 16Mi } }
        - { name: nginx-tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-presentation
spec:
  selector: { app.kubernetes.io/name: {{ .Release.Name }}-presentation }
  ports: [{ name: http, port: 8080, targetPort: http }]
